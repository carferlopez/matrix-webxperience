<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Matrix - Immersive Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="ui-overlay">
      <div class="ui-content">
        <h1 class="wake-up-title">WAKE UP, NEOMAKER.</h1>
        <div class="pills-container">
          <button class="pill-button blue">Píldora Azul</button>
          <button class="pill-button red">Píldora Roja</button>
        </div>
      </div>
    </div>

    <div id="blue-sim-overlay">
      <div class="blue-sim-content">
        <p class="blue-sim-text">Despiertas. Es martes. No ha pasado nada.</p>
        <span class="blue-sim-stamp">APÓCRIFO · Matrix</span>
        <button class="reset-button">Volver a elegir</button>
      </div>
    </div>

    <div id="red-end-overlay">
      <div class="red-end-content">
        <p class="red-end-text">No hay cuchara.</p>
        <span class="red-end-stamp">APÓCRIFO · Matrix · carlosmakes</span>
        <button class="reset-button">Volver a elegir</button>
      </div>
    </div>

    <canvas id="matrix-canvas"></canvas>
    
    <script type="module" src="/main.js"></script>
  </body>
</html>
